<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>ButterEight</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=DM+Sans:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #dd4540;
      --yellow: #ffde59;
      --line: rgba(255,255,255,0.2);
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: #ffffff;
      font-family: 'DM Sans', sans-serif;
      font-weight: 300;
      letter-spacing: 0.02em;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 512 512' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
      opacity: 0.6;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 3rem 1.5rem;
    }

    .container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      animation: fadeUp 0.9s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .header {
      text-align: left;
      padding-bottom: 2.2rem;
      border-bottom: 1px solid var(--line);
      margin-bottom: 2.2rem;
    }

    .wordmark {
      font-family: 'Abril Fatface', serif;
      font-size: 2.6rem;
      letter-spacing: 0.04em;
      line-height: 1;
    }

    .wordmark .butter { color: var(--yellow); }
    .wordmark .eight  { color: #111111; }

    .tagline {
      margin-top: 0.55rem;
      font-size: 0.65rem;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.6);
    }

    .links {
      display: flex;
      flex-direction: column;
    }

    .link-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.15rem 0;
      border-bottom: 1px solid var(--line);
      text-decoration: none;
      color: #ffffff;
      position: relative;
      overflow: hidden;
      transition: color 0.25s ease;
    }

    .link-item::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 1px;
      background: var(--yellow);
      transition: width 0.35s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .link-item:hover::after { width: 100%; }
    .link-item:hover .link-label { color: var(--yellow); }
    .link-item:hover .link-arrow { transform: translate(3px, -3px); opacity: 1; }

    .link-left {
      display: flex;
      flex-direction: column;
      gap: 0.15rem;
    }

    .link-category {
      font-size: 0.58rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.55);
    }

    .link-label {
      font-family: 'Abril Fatface', serif;
      font-size: 1.3rem;
      letter-spacing: 0.02em;
      transition: color 0.25s ease;
    }

    .link-arrow {
      font-size: 0.9rem;
      color: rgba(255,255,255,0.5);
      opacity: 0.5;
      transition: transform 0.25s ease, opacity 0.25s ease;
    }

    .footer {
      margin-top: 2.4rem;
      font-size: 0.58rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.25);
      text-align: left;
    }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="wordmark"><span class="butter">Butter</span><span class="eight">Eight</span></div>
      <div class="tagline">Digital Strategy &amp; Brand Building</div>
    </header>

    <nav class="links">

      <a class="link-item" href="https://buttereight.com" target="_blank" rel="noopener">
        <div class="link-left">
          <span class="link-category">Studio</span>
          <span class="link-label">ButterEight.com</span>
        </div>
        <span class="link-arrow">↗</span>
      </a>

      <a class="link-item" href="medspa-case-study.html">
        <div class="link-left">
          <span class="link-category">Case Study</span>
          <span class="link-label">Medspa Reach Study</span>
        </div>
        <span class="link-arrow">↗</span>
      </a>

      <a class="link-item" href="writing-samples.html">
        <div class="link-left">
          <span class="link-category">Writing</span>
          <span class="link-label">Social Writing Samples</span>
        </div>
        <span class="link-arrow">↗</span>
      </a>

      <a class="link-item" href="https://www.linkedin.com/in/teresaeburr" target="_blank" rel="noopener">
        <div class="link-left">
          <span class="link-category">Connect</span>
          <span class="link-label">LinkedIn</span>
        </div>
        <span class="link-arrow">↗</span>
      </a>

      <a class="link-item" href="https://www.instagram.com/buttereightco" target="_blank" rel="noopener">
        <div class="link-left">
          <span class="link-category">Follow</span>
          <span class="link-label">Instagram</span>
        </div>
        <span class="link-arrow">↗</span>
      </a>

      <a class="link-item" href="mailto:buttereightco@gmail.com">
        <div class="link-left">
          <span class="link-category">Work Together</span>
          <span class="link-label">Get in Touch</span>
        </div>
        <span class="link-arrow">↗</span>
      </a>

    </nav>

    <footer class="footer">© 2026 B8</footer>
  </div>
</body>
</html>
